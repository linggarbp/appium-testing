# Quality gates only: GitHub-hosted runners have no Android device, so the suite is type-checked,
# dry-run (every step bound) and unit-tested here. Real device execution runs where an emulator or
# a device farm is available — point APPIUM_SERVER_URL at one, see the README.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Cucumber dry-run (0 undefined steps)
        run: npx cucumber-js --dry-run

      - name: Unit tests
        run: npm run test:unit
